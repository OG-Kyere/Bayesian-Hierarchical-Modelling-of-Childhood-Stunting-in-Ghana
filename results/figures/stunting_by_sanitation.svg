<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><style>text{font-family:Arial,sans-serif;fill:#222}.t{font-size:20px;font-weight:700}.l{font-size:11px}.v{font-size:12px;font-weight:600}</style><text x="20" y="30" class="t">Weighted stunting prevalence by sanitation</text><line x1="70" y1="370" x2="830" y2="370" stroke="#555"/><rect x="255.3" y="224.3" width="82.0" height="145.7" fill="#4C78A8"/><line x1="296.3" y1="245.0" x2="296.3" y2="203.7" stroke="#222" stroke-width="1.4"/><line x1="291.3" y1="245.0" x2="301.3" y2="245.0" stroke="#222"/><line x1="291.3" y1="203.7" x2="301.3" y2="203.7" stroke="#222"/><text x="296.3" y="196.7" text-anchor="middle" class="v">13.8%</text><text x="296.3" y="392" text-anchor="middle" class="l" transform="rotate(25 296.3 392)">Improved facility</text><rect x="522.7" y="134.2" width="82.0" height="235.8" fill="#4C78A8"/><line x1="563.7" y1="159.2" x2="563.7" y2="109.1" stroke="#222" stroke-width="1.4"/><line x1="558.7" y1="159.2" x2="568.7" y2="159.2" stroke="#222"/><line x1="558.7" y1="109.1" x2="568.7" y2="109.1" stroke="#222"/><text x="563.7" y="102.1" text-anchor="middle" class="v">22.3%</text><text x="563.7" y="392" text-anchor="middle" class="l" transform="rotate(25 563.7 392)">Unimproved/no facility</text><text x="70" y="460" class="l">Bars show weighted prevalence; whiskers show 95% design-based confidence intervals.</text></svg>