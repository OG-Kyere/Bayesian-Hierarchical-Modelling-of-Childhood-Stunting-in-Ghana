name: LaTeX compile checks

on:
  push:
    branches: [main]
    paths:
      - "main.tex"
      - "thesis/**"
      - "manuscript/**"
      - "results/figures/**"
      - ".github/workflows/latex-compile-checks.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - main.tex
          - manuscript/targets/tmih/main.tex
          - manuscript/targets/tmih/supplement.tex
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.target }}
          work_in_root_file_dir: true
          extra_system_packages: "inkscape"
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode -shell-escape"